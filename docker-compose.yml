# Stack del bot de WhatsApp CRM — Perfumería Fina Perú
# Desplegable en Coolify (Cloud o self-hosted), Docker Compose o VPS directa.
#
# Datos persistentes en volúmenes:
#   bot-data   -> /app/data        (conversaciones, pedidos, ajustes, archivos)
#   bot-auth   -> /app/.wwebjs_auth (sesión de WhatsApp: evita re-escanear QR)
#   bot-cache  -> /app/.wwebjs_cache
services:
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: pf-bot
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "25577"
      TZ: America/Lima
      # Chromium: Puppeteer descarga Chrome for Testing al construir la imagen
      HEADLESS: "true"
      SESSION_PATH: /app/.wwebjs_auth
      # --- Supabase ---
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # --- Bot ---
      BOT_TOKEN: ${BOT_TOKEN}
      SESIONES: ${SESIONES:-1}
      OWNER_NUMBER: ${OWNER_NUMBER}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      NUMEROS_PRUEBA: ${NUMEROS_PRUEBA:-}
      MODO_PRUEBA: ${MODO_PRUEBA:-false}
      SIMULAR_ENTRANTES: ${SIMULAR_ENTRANTES:-false}
      AUTO_RESPUESTA: ${AUTO_RESPUESTA:-true}
      RESPONDER_DESCONOCIDOS: ${RESPONDER_DESCONOCIDOS:-true}
      # --- IA ---
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # --- Ritmo / horario ---
      DELAY_MIN: ${DELAY_MIN:-25}
      DELAY_MAX: ${DELAY_MAX:-40}
      MAX_POR_DIA: ${MAX_POR_DIA:-0}
      HORA_INICIO: ${HORA_INICIO:-9}
      HORA_FIN: ${HORA_FIN:-20}
      LUNES_A_SABADO: ${LUNES_A_SABADO:-true}
      SEGUIMIENTO_DIAS_1: ${SEGUIMIENTO_DIAS_1:-3}
      SEGUIMIENTO_DIAS_2: ${SEGUIMIENTO_DIAS_2:-10}
      # --- Panel (CORS y QR con Basic Auth) ---
      PANEL_URL: ${PANEL_URL:-https://crm.perfumeriafinaperu.com}
      PANEL_ORIGINS: ${PANEL_ORIGINS:-https://crm.perfumeriafinaperu.com,https://crm-prfn-peru.pages.dev}
      PANEL_USER: ${PANEL_USER:-dueno}
      PANEL_PASS: ${PANEL_PASS:-}
    volumes:
      - bot-data-v2:/app/data
      - bot-auth-v3:/app/.wwebjs_auth
      - bot-cache-v3:/app/.wwebjs_cache
    expose:
      - "25577"

volumes:
  bot-data-v2:
  bot-auth-v3:
  bot-cache-v3:
