# Perfumería Fina · despliegue con Docker (recomendado para VPS)
#
#   cp bot/.env.production.example bot/.env     # completa los valores reales
#   docker compose up -d --build
#   docker compose logs -f bot
#
# El QR se escanea desde el panel del bot: http://IP:3000/panel
# (o desde el CRM → Ajustes → Conectar WhatsApp, apuntando a esa URL).

services:
  bot:
    build: .
    container_name: pf-bot
    restart: unless-stopped
    env_file:
      - bot/.env
    ports:
      - "3000:3000"
    volumes:
      # Persistencia: chats, pedidos, anuncios y la sesión de WhatsApp.
      - ./bot/data:/app/bot/data
      - ./bot/.wwebjs_auth:/app/bot/.wwebjs_auth
      - ./bot/.wwebjs_cache:/app/bot/.wwebjs_cache
    # Chromium dentro del contenedor necesita /dev/shm amplio.
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/estado').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s