<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de PDF · Perfumería Fina</title>
<style>
  :root{--bg:#14100c;--panel:#1d1813;--line:#332a22;--ink:#f2ebdd;--muted:#a2937f;--gold:#d6b678;--ok:#4caf7d;--err:#e06c61}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  header h1{font-size:.9rem;margin:0}
  .grow{flex:1}
  button,input[type=file]::file-selector-button{
    font:inherit;font-size:.75rem;padding:7px 12px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:#241e18;color:var(--ink);
  }
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.primary{background:var(--gold);color:#1b1410;border-color:var(--gold);font-weight:600}
  button.primary:hover{filter:brightness(1.08);color:#1b1410}
  button:disabled{opacity:.45;cursor:not-allowed}
  label.file{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);cursor:pointer}
  label.file input{display:none}
  label.file span{padding:7px 12px;border:1px dashed var(--gold);border-radius:7px;color:var(--gold)}

  main{flex:1;display:grid;grid-template-columns:1fr 330px;min-height:0}
  .visor{overflow:auto;background:#0d0a08;display:flex;justify-content:center;padding:18px;position:relative}
  .hoja{position:relative;line-height:0;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .hoja img{display:block;max-width:none}
  .caja{position:absolute;cursor:pointer;border:1.5px dashed rgba(110,170,255,.0);
        transition:background .12s,border-color .12s}
  .caja.texto{background:rgba(110,170,255,.10);border-color:rgba(110,170,255,.55)}
  .caja.texto:hover{background:rgba(110,170,255,.28)}
  .caja.imagen{background:rgba(255,170,70,.10);border-color:rgba(255,170,70,.6)}
  .caja.imagen:hover{background:rgba(255,170,70,.26)}
  .caja.sel{background:rgba(214,182,120,.35)!important;border-color:var(--gold)!important;border-style:solid}

  .panel{background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow-y:auto}
  .panel h2{font-size:.8rem;margin:0 0 12px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
  .panel .vacio{font-size:.78rem;color:var(--muted);line-height:1.6}
  .campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .campo label{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .campo textarea,.campo input[type=text],.campo input[type=number]{
    font:inherit;font-size:.8rem;padding:8px 10px;border-radius:7px;
    border:1px solid var(--line);background:#15110d;color:var(--ink);width:100%;
  }
  .campo textarea{min-height:74px;resize:vertical;line-height:1.4}
  .fila{display:flex;gap:10px}
  .fila .campo{flex:1}
  input[type=color]{width:100%;height:34px;background:none;border:1px solid var(--line);border-radius:7px;padding:2px;cursor:pointer}
  .ayuda{font-size:.68rem;color:var(--muted);line-height:1.5;margin-top:10px}
  .aviso{font-size:.7rem;padding:9px 11px;border-radius:7px;margin-bottom:12px;background:#2a2118;border:1px solid #4a3a26;color:#e0cfa8}
  .estado{font-size:.72rem;color:var(--muted)}
  .estado.ok{color:var(--ok)} .estado.err{color:var(--err)}
  .nav{display:flex;align-items:center;gap:6px}
  .nav input{width:52px;text-align:center;font:inherit;font-size:.75rem;padding:6px;border-radius:6px;border:1px solid var(--line);background:#15110d;color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>Editor de PDF</h1>
  <label class="file"><input type="file" id="inputPdf" accept="application/pdf"><span>Abrir otro PDF</span></label>
  <div class="nav">
    <button id="btnPrev">‹</button>
    <input id="numPagina" value="1">
    <span class="estado" id="totalPaginas">/ 41</span>
    <button id="btnNext">›</button>
  </div>
  <div class="grow"></div>
  <span class="estado" id="estado">Listo</span>
  <button id="btnGuardar">Guardar PDF</button>
  <button class="primary" id="btnDescargar">Descargar</button>
</header>

<main>
  <div class="visor" id="visor">
    <div class="hoja" id="hoja">
      <img id="pagina" alt="Página del PDF">
    </div>
  </div>

  <aside class="panel">
    <div class="aviso">
      Clic sobre un <b>texto</b> (azul) para editarlo o sobre una <b>foto</b> (naranja) para reemplazarla.
    </div>
    <div id="editor">
      <h2>Sin selección</h2>
      <p class="vacio">Elegí un texto o una imagen de la hoja para empezar.</p>
    </div>
  </aside>
</main>

<script>
const estado = document.getElementById("estado");
const hoja = document.getElementById("hoja");
const imgPagina = document.getElementById("pagina");
const panel = document.getElementById("editor");
const numPagina = document.getElementById("numPagina");

let paginaActual = 1;
let totalPaginas = 41;
let capa = { textos: [], imagenes: [], ancho: 595, alto: 842 };
let seleccion = null;

function pintarEstado(t, tipo = "") { estado.textContent = t; estado.className = "estado " + tipo; }

async function cargarEstado() {
  const r = await fetch("/api/estado");
  const d = await r.json();
  totalPaginas = d.paginas;
  document.getElementById("totalPaginas").textContent = "/ " + d.paginas;
  numPagina.value = paginaActual;
}

async function cargarPagina(n) {
  paginaActual = Math.min(Math.max(1, n), totalPaginas);
  numPagina.value = paginaActual;
  seleccion = null;
  panel.innerHTML = "<h2>Sin selección</h2><p class='vacio'>Elegí un texto o una imagen de la hoja para empezar.</p>";
  pintarEstado("Cargando página…");
  imgPagina.src = "/api/pagina?n=" + paginaActual + "&t=" + Date.now();
  await new Promise((res) => { imgPagina.onload = res; });
  const r = await fetch("/api/capa?n=" + paginaActual);
  capa = await r.json();
  pintarCajas();
  pintarEstado("Página " + paginaActual + " de " + totalPaginas);
}

function pintarCajas() {
  hoja.querySelectorAll(".caja").forEach((c) => c.remove());
  const escala = imgPagina.clientWidth / capa.ancho;

  capa.textos.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "caja texto";
    d.dataset.tipo = "texto";
    d.dataset.i = i;
    const [x0, y0, x1, y1] = t.bbox;
    d.style.left = x0 * escala + "px";
    d.style.top = y0 * escala + "px";
    d.style.width = Math.max(6, (x1 - x0) * escala) + "px";
    d.style.height = Math.max(6, (y1 - y0) * escala) + "px";
    d.title = t.texto;
    d.addEventListener("click", (e) => { e.stopPropagation(); seleccionar("texto", t, d); });
    hoja.appendChild(d);
  });

  capa.imagenes.forEach((im) => {
    const d = document.createElement("div");
    d.className = "caja imagen";
    d.dataset.tipo = "imagen";
    const [x0, y0, x1, y1] = im.bbox;
    d.style.left = x0 * escala + "px";
    d.style.top = y0 * escala + "px";
    d.style.width = Math.max(8, (x1 - x0) * escala) + "px";
    d.style.height = Math.max(8, (y1 - y0) * escala) + "px";
    d.addEventListener("click", (e) => { e.stopPropagation(); seleccionar("imagen", im, d); });
    hoja.appendChild(d);
  });
}

function marcar(caja) {
  hoja.querySelectorAll(".caja.sel").forEach((c) => c.classList.remove("sel"));
  if (caja) caja.classList.add("sel");
}

function seleccionar(tipo, dato, caja) {
  seleccion = { tipo, dato };
  marcar(caja);
  if (tipo === "texto") return panelTexto(dato);
  return panelImagen(dato);
}

function panelTexto(t) {
  panel.innerHTML = `
    <h2>Editar texto</h2>
    <div class="campo"><label>Texto</label><textarea id="pTxt"></textarea></div>
    <div class="fila">
      <div class="campo"><label>Tamaño</label><input type="number" id="pTam" step="0.5" min="4" max="72"></div>
      <div class="campo"><label>Color</label><input type="color" id="pColor"></div>
    </div>
    <p class="ayuda">Fuente detectada: <b>${escapar(t.fuente || "—")}</b></p>
    <button class="primary" id="pAplicar" style="width:100%">Aplicar cambio</button>
    <p class="ayuda">Se borra el texto original y se escribe el nuevo en la misma posición.</p>`;
  panel.querySelector("#pTxt").value = t.texto;
  panel.querySelector("#pTam").value = t.tamano;
  panel.querySelector("#pColor").value = t.color;
  panel.querySelector("#pAplicar").addEventListener("click", aplicarTexto);
}

async function aplicarTexto() {
  const texto = panel.querySelector("#pTxt").value;
  const tamano = Number(panel.querySelector("#pTam").value) || seleccion.dato.tamano;
  const color = panel.querySelector("#pColor").value;
  if (!texto.trim()) return alert("El texto no puede quedar vacío.");
  pintarEstado("Aplicando…");
  try {
    const r = await fetch("/api/texto", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pagina: paginaActual, bbox: seleccion.dato.bbox, origen: seleccion.dato.origen,
                             texto, tamano, color, fuente: seleccion.dato.fuente }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Error");
    pintarEstado("Texto cambiado ✓", "ok");
    await cargarPagina(paginaActual);
  } catch (e) {
    pintarEstado("Error", "err"); alert(e.message);
  }
}

function panelImagen(im) {
  panel.innerHTML = `
    <h2>Reemplazar foto</h2>
    <p class="ayuda">Tamaño actual: ${im.w}×${im.h} px</p>

    <div class="campo"><label>Desde un enlace (URL)</label>
      <input type="text" id="pUrl" placeholder="https://.../foto.jpg">
    </div>
    <button class="primary" id="pAplicarUrl" style="width:100%">Usar esta imagen</button>

    <div style="margin:16px 0 12px;border-top:1px solid var(--line)"></div>

    <div class="campo"><label>…o desde tu equipo</label><input type="file" id="pImg" accept="image/*"></div>
    <button id="pAplicarImg" style="width:100%">Subir archivo</button>

    <div id="pPreview" style="margin-top:14px"></div>
    <p class="ayuda">Se mantiene la posición y el tamaño del marco; la imagen se adapta.</p>`;

  const campoUrl = panel.querySelector("#pUrl");
  const preview = panel.querySelector("#pPreview");

  campoUrl.addEventListener("input", () => {
    const u = campoUrl.value.trim();
    preview.innerHTML = /^https?:\/\//i.test(u)
      ? `<img src="${u}" alt="Vista previa" style="width:100%;border-radius:8px;border:1px solid var(--line);background:#fff">`
      : "";
  });

  panel.querySelector("#pAplicarUrl").addEventListener("click", async () => {
    const url = campoUrl.value.trim();
    if (!/^https?:\/\//i.test(url)) return alert("Pegá un enlace que empiece con http:// o https://");
    pintarEstado("Descargando imagen…");
    try {
      const r = await fetch("/api/imagen", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pagina: paginaActual, xref: im.xref, bbox: im.bbox, url }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Error");
      pintarEstado("Foto reemplazada ✓", "ok");
      await cargarPagina(paginaActual);
    } catch (e) {
      pintarEstado("Error", "err"); alert(e.message);
    }
  });

  panel.querySelector("#pAplicarImg").addEventListener("click", async () => {
    const archivo = panel.querySelector("#pImg").files[0];
    if (!archivo) return alert("Elegí una imagen primero.");
    const dataUrl = await new Promise((res) => {
      const lector = new FileReader();
      lector.onload = () => res(lector.result);
      lector.readAsDataURL(archivo);
    });
    pintarEstado("Reemplazando…");
    try {
      const r = await fetch("/api/imagen", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pagina: paginaActual, xref: im.xref, bbox: im.bbox, dataUrl }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Error");
      pintarEstado("Foto reemplazada ✓", "ok");
      await cargarPagina(paginaActual);
    } catch (e) {
      pintarEstado("Error", "err"); alert(e.message);
    }
  });
}

document.getElementById("btnPrev").addEventListener("click", () => cargarPagina(paginaActual - 1));
document.getElementById("btnNext").addEventListener("click", () => cargarPagina(paginaActual + 1));
numPagina.addEventListener("change", () => cargarPagina(Number(numPagina.value) || 1));

document.getElementById("inputPdf").addEventListener("change", async (e) => {
  const archivo = e.target.files[0];
  if (!archivo) return;
  pintarEstado("Abriendo PDF…");
  const dataUrl = await new Promise((res) => {
    const lector = new FileReader();
    lector.onload = () => res(lector.result);
    lector.readAsDataURL(archivo);
  });
  const r = await fetch("/api/abrir", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dataUrl }),
  });
  const d = await r.json();
  if (!r.ok) { pintarEstado("Error", "err"); return alert(d.error); }
  await cargarEstado();
  await cargarPagina(1);
});

document.getElementById("btnGuardar").addEventListener("click", async () => {
  pintarEstado("Guardando…");
  const r = await fetch("/api/guardar", { method: "POST" });
  const d = await r.json();
  if (!r.ok) { pintarEstado("Error", "err"); return alert(d.error); }
  pintarEstado("Guardado ✓ (" + Math.round(d.bytes / 1024 / 1024 * 10) / 10 + " MB)", "ok");
});

document.getElementById("btnDescargar").addEventListener("click", () => window.open("/pdf", "_blank"));

function escapar(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

window.addEventListener("resize", () => { if (capa.textos.length || capa.imagenes.length) pintarCajas(); });

(async () => {
  await cargarEstado();
  await cargarPagina(1);
})();
</script>
</body>
</html>
