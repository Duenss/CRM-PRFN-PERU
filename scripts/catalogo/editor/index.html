<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor del catálogo · Perfumería Fina</title>
<style>
  :root{
    --bone:#F4F0E7; --ivory:#FBF8F2; --ink:#1B1410; --muted:#6E6154;
    --gold:#B9914C; --gold-deep:#8A672B; --line:#DED4C2;
    --ok:#2E7D4F; --err:#B3261E; --warn:#8A5A00;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,--apple-system,"Segoe UI",sans-serif;background:var(--bone);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{
    display:flex;align-items:center;gap:16px;padding:12px 18px;
    background:var(--ivory);border-bottom:1px solid var(--line);flex:none;
  }
  header h1{font-size:.95rem;margin:0;letter-spacing:.02em}
  header .sub{font-size:.72rem;color:var(--muted)}
  .acciones{margin-left:auto;display:flex;gap:8px;align-items:center}
  button{
    font:inherit;font-size:.78rem;padding:8px 14px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink);transition:.15s;
  }
  button:hover{border-color:var(--gold);color:var(--gold-deep)}
  button.primary{background:var(--ink);color:var(--bone);border-color:var(--ink)}
  button.primary:hover{background:#2b2119;color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  .estado{font-size:.72rem;color:var(--muted);min-width:130px;text-align:right}
  .estado.ok{color:var(--ok)} .estado.err{color:var(--err)} .estado.warn{color:var(--warn)}

  main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
  aside{background:var(--ivory);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .buscador{padding:10px;border-bottom:1px solid var(--line)}
  .buscador input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.8rem;background:#fff}
  .contador{padding:6px 12px;font-size:.68rem;color:var(--muted);border-bottom:1px solid var(--line)}
  .lista{overflow-y:auto;flex:1}
  .item{
    display:flex;gap:10px;align-items:center;padding:8px 10px;cursor:pointer;
    border-bottom:1px solid rgba(0,0,0,.045);font-size:.78rem;
  }
  .item:hover{background:#fff}
  .item.activo{background:#fff;border-left:3px solid var(--gold);padding-left:7px}
  .item img{width:38px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;flex:none}
  .item div{min-width:0}
  .item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .item span{color:var(--muted);font-size:.68rem}

  section{overflow-y:auto;padding:22px 26px;min-height:0}
  .ficha{display:grid;grid-template-columns:260px 1fr;gap:26px;max-width:1000px}
  .foto{position:sticky;top:0;align-self:start}
  .foto .marco{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    display:grid;place-items:center;aspect-ratio:1;padding:12px;
  }
  .foto img{max-width:100%;max-height:100%;object-fit:contain}
  .foto label{display:block;margin-top:10px}
  .foto input[type=file]{display:none}
  .foto .btnfoto{
    display:block;text-align:center;padding:9px;border:1px dashed var(--gold);
    border-radius:8px;color:var(--gold-deep);font-size:.75rem;cursor:pointer;
  }
  .foto .btnfoto:hover{background:#fff9ec}
  .foto .ruta{font-size:.63rem;color:var(--muted);margin-top:6px;word-break:break-all;text-align:center}

  .campos{display:grid;gap:14px}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .campo{display:flex;flex-direction:column;gap:5px}
  .campo label{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .campo input,.campo select,.campo textarea{
    font:inherit;font-size:.82rem;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);width:100%;
  }
  .campo textarea{resize:vertical;min-height:64px;line-height:1.45}
  .campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid rgba(185,145,76,.35);border-color:var(--gold)}
  .cabecera{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
  .cabecera h2{font-size:1.1rem;margin:0}
  .cabecera .cod{font-size:.7rem;color:var(--muted)}
  .aviso{
    background:#fff9ec;border:1px solid #e8d3a3;color:#7a5a12;font-size:.72rem;
    padding:10px 12px;border-radius:8px;margin-bottom:18px;
  }
  .log{
    grid-column:1/-1;background:#12201a;color:#c8e6d0;font-family:ui-monospace,Consolas,monospace;
    font-size:.68rem;line-height:1.5;padding:14px;border-radius:10px;white-space:pre-wrap;
    max-height:240px;overflow:auto;display:none;
  }
  .log.visible{display:block}
  .log.err{background:#2a1412;color:#f3c9c4}
  @media (max-width:900px){
    main{grid-template-columns:1fr}
    aside{display:none}
    .ficha{grid-template-columns:1fr}
    .foto{position:static;max-width:220px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Editor del catálogo</h1>
    <div class="sub">Perfumería Fina Perú · Navidad 2026 · 202 productos</div>
  </div>
  <div class="acciones">
    <span class="estado" id="estado">Cargando…</span>
    <button id="btnGuardar" disabled>Guardar cambios</button>
    <button class="primary" id="btnBuild">Regenerar PDF</button>
    <button id="btnPdf">Descargar PDF</button>
  </div>
</header>

<main>
  <aside>
    <div class="buscador"><input id="buscar" placeholder="Buscar por nombre, casa o código…" autocomplete="off"></div>
    <div class="contador" id="contador"></div>
    <div class="lista" id="lista"></div>
  </aside>

  <section>
    <div class="aviso">
      Los cambios se guardan en <b>productos.json</b>. Después presioná <b>Regenerar PDF</b>
      para que el catálogo refleje los textos y las fotos nuevas.
    </div>
    <div class="ficha" id="ficha" hidden>
      <div class="foto">
        <div class="marco"><img id="preview" alt="Foto del perfume"></div>
        <label><input type="file" id="inputFoto" accept="image/*"><span class="btnfoto">Cambiar foto</span></label>
        <div class="ruta" id="rutaFoto"></div>
      </div>
      <div>
        <div class="cabecera">
          <h2 id="tituloFicha">—</h2>
          <span class="cod" id="codFicha"></span>
        </div>
        <div class="campos">
          <div class="fila">
            <div class="campo"><label for="fNombre">Nombre</label><input id="fNombre" data-campo="nombre"></div>
            <div class="campo"><label for="fCasa">Casa inspirada</label><input id="fCasa" data-campo="casa_inspirada"></div>
          </div>
          <div class="fila">
            <div class="campo"><label for="fCategoria">Categoría</label>
              <select id="fCategoria" data-campo="categoria">
                <option value="disenador">Diseñador Francés</option>
                <option value="arabe">Árabe</option>
                <option value="nicho">Nicho de Autor</option>
              </select>
            </div>
            <div class="campo"><label for="fGenero">Género</label>
              <select id="fGenero" data-campo="genero">
                <option value="dama">Dama</option>
                <option value="caballero">Caballero</option>
                <option value="unisex">Unisex</option>
              </select>
            </div>
          </div>
          <div class="campo"><label for="fFamilia">Familia olfativa</label><input id="fFamilia" data-campo="familia_olfativa"></div>
          <div class="campo"><label for="fNotas">Notas (separadas por punto y coma)</label><textarea id="fNotas" data-campo="notas"></textarea></div>
          <div class="campo"><label for="fDesc">Descripción</label><textarea id="fDesc" data-campo="descripcion"></textarea></div>
          <div class="fila">
            <div class="campo"><label for="fP50">Precio 50 ml</label><input id="fP50" type="number" data-campo="precio_50ml"></div>
            <div class="campo"><label for="fP100">Precio 100 ml</label><input id="fP100" type="number" data-campo="precio_100ml"></div>
          </div>
        </div>
      </div>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>

<script>
const estado = document.getElementById("estado");
const listaEl = document.getElementById("lista");
const contadorEl = document.getElementById("contador");
const fichaEl = document.getElementById("ficha");
const logEl = document.getElementById("log");

let productos = [];
let actual = null;
let sucios = new Set();

function pintarEstado(texto, tipo = "") {
  estado.textContent = texto;
  estado.className = "estado " + tipo;
}

async function cargar() {
  const r = await fetch("/api/productos");
  const d = await r.json();
  productos = d.productos;
  pintarEstado("Cargado", "ok");
  pintarLista();
}

function pintarLista() {
  const q = document.getElementById("buscar").value.trim().toLowerCase();
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const filtrados = productos.filter((p) =>
    !q || norm(p.nombre).includes(norm(q)) || norm(p.casa_inspirada).includes(norm(q)) || norm(p.codigo).includes(norm(q)) || norm(p.id).includes(norm(q))
  );
  contadorEl.textContent = filtrados.length + " de " + productos.length + " productos";
  listaEl.innerHTML = filtrados.map((p) => `
    <div class="item ${actual && actual.id === p.id ? "activo" : ""}" data-id="${p.id}">
      <img src="/img/${encodeURIComponent(p.imagen_ruta.split("/").pop())}" alt="" loading="lazy">
      <div><b>${escapar(p.nombre)}</b><span>${escapar(p.casa_inspirada || "")}</span></div>
    </div>`).join("");
}

function escapar(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function abrir(id) {
  const p = productos.find((x) => x.id === id);
  if (!p) return;
  actual = p;
  fichaEl.hidden = false;
  document.getElementById("tituloFicha").textContent = p.nombre;
  document.getElementById("codFicha").textContent = p.codigo || p.id;
  document.getElementById("preview").src = "/img/" + encodeURIComponent(p.imagen_ruta.split("/").pop()) + "?v=" + Date.now();
  document.getElementById("rutaFoto").textContent = p.imagen_ruta;
  for (const input of document.querySelectorAll("[data-campo]")) {
    const campo = input.dataset.campo;
    let valor = p[campo];
    if (campo === "notas" && Array.isArray(valor)) valor = valor.join("; ");
    input.value = valor == null ? "" : valor;
  }
  pintarLista();
}

document.getElementById("lista").addEventListener("click", (e) => {
  const item = e.target.closest(".item");
  if (item) abrir(item.dataset.id);
});

document.getElementById("buscar").addEventListener("input", pintarLista);

document.querySelectorAll("[data-campo]").forEach((input) => {
  input.addEventListener("input", () => {
    if (!actual) return;
    const campo = input.dataset.campo;
    if (campo === "notas") actual[campo] = input.value.split(";").map((s) => s.trim()).filter(Boolean);
    else if (campo.startsWith("precio_")) actual[campo] = Number(input.value) || 0;
    else actual[campo] = input.value;
    if (campo === "nombre") {
      document.getElementById("tituloFicha").textContent = input.value;
      pintarLista();
    }
    marcarSucio();
  });
});

function marcarSucio() {
  document.getElementById("btnGuardar").disabled = false;
  pintarEstado("Sin guardar", "warn");
}

document.getElementById("btnGuardar").addEventListener("click", async () => {
  const btn = document.getElementById("btnGuardar");
  btn.disabled = true;
  pintarEstado("Guardando…");
  try {
    const r = await fetch("/api/productos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ productos }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Error al guardar");
    pintarEstado("Guardado ✓", "ok");
  } catch (e) {
    pintarEstado("Error al guardar", "err");
    alert(e.message);
    btn.disabled = false;
  }
});

document.getElementById("inputFoto").addEventListener("change", async (e) => {
  const archivo = e.target.files && e.target.files[0];
  if (!archivo || !actual) return;
  if (!archivo.type.startsWith("image/")) return alert("Elegí una imagen.");
  pintarEstado("Subiendo foto…");
  const dataUrl = await new Promise((res) => {
    const lector = new FileReader();
    lector.onload = () => res(lector.result);
    lector.readAsDataURL(archivo);
  });
  try {
    const r = await fetch("/api/imagen", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dataUrl, ruta: actual.imagen_ruta }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "No se pudo guardar la imagen");
    document.getElementById("preview").src = "/img/" + encodeURIComponent(actual.imagen_ruta.split("/").pop()) + "?v=" + Date.now();
    pintarEstado("Foto actualizada ✓", "ok");
    e.target.value = "";
  } catch (err) {
    pintarEstado("Error con la foto", "err");
    alert(err.message);
  }
});

document.getElementById("btnBuild").addEventListener("click", async () => {
  const btn = document.getElementById("btnBuild");
  btn.disabled = true;
  pintarEstado("Generando PDF…");
  logEl.className = "log visible";
  logEl.textContent = "Generando catálogo…\n";
  try {
    const r = await fetch("/api/build", { method: "POST" });
    const d = await r.json();
    logEl.textContent = d.salida || "(sin salida)";
    if (d.ok) {
      logEl.className = "log visible";
      pintarEstado("PDF listo ✓", "ok");
    } else {
      logEl.className = "log visible err";
      pintarEstado("Falló el PDF", "err");
    }
  } catch (e) {
    logEl.className = "log visible err";
    logEl.textContent = String(e);
    pintarEstado("Error", "err");
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("btnPdf").addEventListener("click", () => {
  window.open("/pdf", "_blank");
});

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    document.getElementById("btnGuardar").click();
  }
});

cargar().catch((e) => pintarEstado("Error al cargar", "err"));
</script>
</body>
</html>
