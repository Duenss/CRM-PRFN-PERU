name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  bot:
    name: Pruebas del bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Pruebas unitarias
        run: npm test

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Escanear historial y árbol de trabajo
        run: node scripts/scan-secrets.mjs
